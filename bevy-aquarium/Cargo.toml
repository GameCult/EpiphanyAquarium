[package]
name = "bevy-aquarium"
version = "0.1.0"
edition = "2024"

[features]
dev = []
hotpatch = ["dev", "bevy/hotpatching"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_audio",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_input_focus",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "file_watcher",
    "hdr",
    "keyboard",
    "mouse",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "webgpu",
    "zstd_rust",
] }
anyhow = "1"
bevy_procedural_audio = { path = "../vendor/bevy_procedural_audio", default-features = false, features = ["bevy_audio"] }
cultcache-rs = { path = "../../cultcache-rs" }
cultnet-rs = { path = "../../cultnet-rs" }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1
