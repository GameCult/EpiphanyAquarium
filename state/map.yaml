project:
  name: Epiphany Aquarium
  root: E:\Projects\EpiphanyAquarium
  backend_root: E:\Projects\EpiphanyAgent
  purpose: >
    A cute, dynamic, fullscreen aquarium interface for Epiphany's operator and
    specialist state. The aquarium owns interaction grammar, visual simulation,
    audio feedback, motion language, and taste.

current_model:
  migration_target:
    engine: Bevy 0.18 Rust host
    path: bevy-aquarium
    migration_map: notes/bevy-migration-map.md
    communication: cultnet-rs
    persistence: cultcache-rs
    principle: >
      The aquarium renderer is moving to a Rust-native Bevy client. Bevy owns
      world-space simulation and rendering; cultnet-rs owns agent communication;
      cultcache-rs owns settings and persistent client state.
    renderer_doctrine: >
      The live renderer is a Rust/WGPU field machine. ECS state feeds custom
      Bevy render graph nodes, compute/storage resources carry Grid-space
      lighting and occupancy, and raymarched surfaces write Bevy deferred
      prepass data. Legacy React/WebGL/Tauri surfaces are migration fallback,
      not the architecture center.
  frontend:
    framework: React + Vite + Tauri v2
    primary_files:
      - src/App.tsx
      - src/aquariumFluid.ts
      - src/aquariumStardust.ts
      - src/styles.css
      - scripts/visual-smoke.mjs
  backend_boundary:
    description: >
      Tauri commands call scripts in the sibling EpiphanyAgent repo. The
      aquarium is a client and operator surface, not a harness source of truth.
      A swarm registry can now point multiple workspace-scoped Epiphany
      instances at the shared harness while keeping cwd, codex-home, state, and
      artifacts separate.
    env:
      - EPIPHANY_AGENT_ROOT
  artifacts:
    aquarium: .epiphany-aquarium
    backend_gui: E:\Projects\EpiphanyAgent\.epiphany-gui
  behavior_map: notes/aquarium-behavior-map.md
  renderer_map: notes/aquarium-renderer-map.md
  rust_vfx_research_map: notes/rust-vfx-research-map.md
  backend_api_tree_map: notes/epiphany-agent-api-tree-map.md
  aetheria_volumetric_fog_map: notes/aetheria-volumetric-fog-map.md
  bruneton_atmospheric_scattering_map: notes/bruneton-atmospheric-scattering-map.md

interaction_laws:
  - The default screen shows only the aquarium, agents, fluid, and ambient state.
  - Data and controls appear only through interaction with aquarium objects.
  - Agent options are DOM controls anchored to the agent.
  - Focus surfaces are selected-agent local shells, not global panels.
  - Agent motion is force-based and role-symmetric: every creature has the same spring body, with orbit slots, cursor gravity-gradient attraction, hover hold, and future inter-Epiphany approach expressed as forces instead of coordinator exceptions.
  - Agent motion stays spring-tethered to visible orbit slots; cursor force is welcoming at range, only Soul pulls back weakly, and all creatures attract strongly up close.
  - Pointer force follows Aetheria's gravity model: derive force from a PowerPulse heightfield normal and scale by horizontal slope squared so wells taper near their centers.
  - Agents hover above their gravity cups; WebGL renders the well surface underneath, while DOM glyphs receive elevation and scale from projected height.
  - The Three.js spatial layer owns the visible 3D grid: gravity cups and chirp waves splat into a grid-aligned render target, then the mesh samples that accumulated gravity texture for displacement.
  - Each swarm has a large shared gravity divot centered around Self/coordinator in addition to individual agent wells; the cohesion force that holds agents in orbit is expressed as a gravity-gradient force.
  - Aetheria's current PowerPulse envelope is the cup/mask curve; low chirp-bank partials become multiple radial wave emitters so excited agents vibrate the grid like small speakers.
  - The aquarium camera is near-omniscient: grid coordinates project through a tilted overhead camera, and cursor input unprojects back to the grid before applying force.
  - Three.js camera controls use an orbital rig: the target is a point on the XY grid, yaw/pitch/distance convert to a Cartesian camera offset, +Z is up, middle drag mutates yaw/pitch, wheel zooms exponentially, right drag pans by projected XY mouse-hit deltas, and WASD pans along the projected view basis.
  - Grid scale follows zoom: camera distance drives both the procedural cell size and the actual rendered grid extent, while gravity wells remain in stable world coordinates.
  - In the Bevy host, the camera target is the Grid center invariant: it is clamped to the global XY plane, the Grid square is centered there, zoom determines the square half-extent, and the heightfield mesh is rebuilt over that moving domain. Agent orbit anchors remain world-space simulation state.
  - Epiphany project labels are world-space DOM billboards projected by the Three camera and fade in as the user zooms out.
  - As swarm/workspace labels fade in, sub-agent captions fade away; zoom level chooses the active hierarchy instead of stacking all labels.
  - Each harness/workspace label is a menu root with radial DOM petals for swarm-level navigation.
  - Registered Epiphanies are visible even when their harness is not running: sleeping members render as cold white dwarf bodies, and only live members with heartbeat/running signals expand into specialist constellations.
  - Three camera projection is the placement authority for DOM agents, thought bubbles, option halos, focus surfaces, stardust attractors, and pointer-to-grid input; percent-space projection is fallback only.
  - UI branches now use SVG/DOM camera-facing billboards attached to world-space creature anchors: Three emits separate focus/thought/option screen anchors and scales, and DOM pointer movement maps into billboard-local coordinates for crisp interaction.
  - The 3D body is the agent body. The centered DOM caption is its ID tag, hit target, and interaction-graph root; glyph icons are hidden because they duplicate the body.
  - When the pointer is inside a creature billboard, the creature's orbit integration holds position so menus do not drift away from the user's hand.
  - Visible non-DOM aquarium elements belong in the Three/HDR compositor. Legacy smoke, crisp, and stardust canvases may remain for compatibility, but they must not be visible screen-space layers.
  - The visible field stage belongs to the WebGPU marched renderer: the grid is a heightfield surface with a fog bank over it, while Three is allowed to provide camera/projection/source rigging rather than visible geometry.
  - Fog is now a first-class field-volume pass in the Three layer: camera rays sample SDF solids, gassy SDF density, pointer/agent density sources, and the shared moving gravity texture instead of rendering fog as detached screen tint.
  - WebGPU froxels own soft directional volumetric light: first-order spherical harmonics are propagated through the froxel grid, environment light is injected from grid-volume edges, and Self injects warm local emission.
  - WebGPU froxel x/y dimensions stay canvas-local and screen-fit; only froxel near/far depth is fitted to the projected moving grid volume.
  - Agent solid bodies use a consistent world-space radius across the swarm; WebGPU reconstructs world-space camera rays and intersects world-space planet SDFs, so apparent size follows the camera instead of a projection-scale multiplier.
  - The fitted grid/fog volume is the visibility window: solid bodies, atmospheres, and fog fade at its near/far bounds instead of rendering outside the current grid area of interest.
  - In the Bevy renderer, the Grid remains a solid raymarched heightfield terrain surface. Fog can return later as a separate field pass, but this lean path marches terrain and body solids only.
  - The Bevy visible world must not use traditional mesh geometry for terrain, planets, or cursor probes. Source entities may carry transforms, labels, cache state, and simulation components, but the fullscreen raymarcher owns the visible Grid and bodies.
  - The Bevy raymarcher must feed Bevy's deferred prepass, not only final color. Raymarched terrain/body hits write depth, normal, motion vector, deferred material data, and deferred lighting pass id into Bevy prepass textures before deferred lighting and TAA consume them.
  - Surface raymarching must run once per frame. Lighting/brick compute may prepare fields first, but terrain/body raymarching belongs in `fs_deferred_prepass`; final composition consumes stored Bevy prepass/G-buffer data instead of running a second fullscreen raymarch.
  - In the Bevy raymarcher, non-Self surfaces should not use fake environment fullbright. Self injects radiance into a compact SH froxel cache; previous coefficients decay and propagate through neighbors, and surfaces/atmosphere sample that local lighting field.
  - The Grid atmosphere exists only inside the current radial Grid domain. It uses exponential falloff above the heightfield, fades through a circular mask around the Grid center and near/far volume bounds, and integrates in-scatter/transmittance along the same camera ray before the solid terrain/body composite.
  - SH lighting must be filtered before it reaches fog or surfaces. The compact Bevy path uses trilinear SH sampling, a 32x32x12 Grid-space light volume, softened radial fade, and stable per-pixel march jitter to avoid visible lattice columns.
  - Bevy volumetric lighting is GPU-owned and Grid-space. A custom render node dispatches a compute shader before the fullscreen raymarch; ping-pong storage buffers carry first-order SH coefficients over the moving Grid volume, reproject history through previous Grid center/scale in XY, scatter through neighbors, and receive Self radiance injection.
  - Self solar flares are field simulation events: inject a short local radiance impulse, then advect previous SH history outward through the Grid-space volume so the flare becomes a carried volumetric wavefront instead of an analytic shell painted into every cell.
  - The Bevy light brick map is dynamic GPU state, not static topology. Rebuild occupancy every frame from current Grid terrain contact, moving body bounds, Self influence, and flare bands before SH lighting decides which cells get detailed flow.
  - Global sky and aerial-perspective lighting should use Bruneton-style precomputed transport caches; local dynamic fog should not be forced to solve horizon-scale multiple scattering per frame.
  - Visual smoke verifies render presence and layout health, not cursor-driven 3D interaction; billboard/creature clicks need targeted raycast-aware probes.
  - Stardust is currently visible as tiny, faint 3D points inside the Three scene under ACES tone mapping; the old WebGPU overlay is disabled until it can feed the shared compositor instead of screen space.
  - Transparent-looking depth-sensitive VFX should use stochastic blue-noise cutout coverage and temporal resolve assumptions, not ordinary alpha blending, when they need to coexist with fog/depth.
  - Every creature carries the shared heartbeat; the latest awakened role gets the stronger plucked-string oscillation.
  - WebGL fluid emission must correspond to visible objects.
  - Audio must respond once per deliberate input gesture.

next_actions:
  - Expand visual smoke across all eight creature interaction trees, including the shared heartbeat branch.
  - Add visual tests for all eight creature habitats, not only Eyes.
  - Give Self, Face, Eyes, Imagination, Body, Hands, Soul, and Life distinct motion/reveal signatures.
  - Make agent petals more object-native while keeping them real DOM buttons.
  - Add visual tests for empty-water dismissal, offscreen-safe focus anchoring, agent-specific petals, and one-hit control audio.
  - Consider a debug-only keyboard chord for utilitarian always-on panels.
  - Deepen Face as the chat/aura organism now that backend heartbeatStatus, runHeartbeat, and faceBubble actions exist.
  - Render swarm members as first-class aquarium organisms instead of only selecting them through Self's connection leaf.

landed:
  - Face is now an interactible aquarium organism. Its habitat exposes heartbeat status, heartbeat pulse, and bubble leaves over EpiphanyAgent's backend GUI action bridge.
  - The Tauri action bridge passes heartbeatStatus, runHeartbeat, and faceBubble through to EpiphanyAgent, so Face can surface local Aquarium chat bubbles without Discord.
  - Heartbeat is now shared creature anatomy. Every agent habitat has a Heartbeat branch with Status and Pulse leaves; Face keeps the Bubble leaf as the public mouth.
  - Orbits are now visible as thin dashed gradient guides; mouse attraction pulls agents without severing orbit tethering, and touch/heartbeat chirps use plucked-string damping.
  - Aetheria-style gravity cups now shape pointer attraction and the WebGL aquarium surface; agents project a hover offset above their wells.
  - Added an optional WebGPU compute stardust layer modeled after Aetheria's compute particles, keyed from agent flow instead of gravity.
  - Added a tilted grid camera projection: shader pixels sample the grid through an inverse camera map, DOM agents project through the same view, and the cursor becomes a grid landing mark.
  - Added a Three.js field layer with an Aetheria-style orthographic gravity render target: additive PowerPulse and radial-wave splat quads feed a sampled grid mesh instead of forcing every grid vertex to evaluate every source.
  - Mapped the low-frequency agent chirp bank into radial grid vibration channels, preserving the Aetheria split between static wells and gas-giant-like wave breathing.
  - Added a swarm registry seam. `.epiphany-aquarium/swarm.json` registers EpiphanyAgent and AetheriaLore, and the Tauri backend scopes status, actions, codex-home, workspace root, and artifact roots to the selected member.
  - Added the first field-first SDF/fog renderer brick: `src/aquariumScene3d.ts` now raymarches SDF solids and gassy SDF fog against the shared gravity/grid domain with phase-paired triangle noise and stochastic solid coverage.
  - Replaced visible agent mesh bodies with field-volume chrome planet SDFs. Each swarm member is displaced by cheap local-domain 4D fBm, wrapped in a mass-scaled gassy atmosphere, and Self renders as a solar body with hotter emissive/corona noise.
  - Documented the live renderer as a hybrid Three/Aetheria gravity-domain plus fullscreen analytic SDF/gas raymarch, and explicitly separated that from the intended future Wronski froxel and sparse brick-map architecture.
  - Added a real WebGPU froxel primitive-map field layer. A compute pass writes one primitive-membership bitmask per froxel into a storage buffer, and the WebGPU render pass samples those masks while marching so pixels evaluate only relevant agent planet/atmosphere fields. The older WebGL field-volume path is now fallback-only when WebGPU is absent.
  - Added the first WebGPU froxel SH lighting cache. A compute pass ping-pongs low-order radiance coefficients, propagates neighbor light, injects the studio HDR summary from the volume edges, injects Self emission, and the raymarch samples that lighting for gas and solid wrap instead of relying on a screen-space glow.
  - Fitted the WebGPU froxel depth interval to the projected grid volume while keeping x/y screen-aligned. Agent primitives now carry projected body depth, so masks and raymarch samples are bounded by the live grid volume instead of a fake full-depth corridor.
  - Normalized agent body size across WebGPU and WebGL SDF paths as a world-space radius, moved the WebGPU solid path to camera-ray/world-center SDF intersections, and removed the old z-derived DOM label elevation offset that made Self appear to bounce in screen space.
  - Separated swarm registry presence from runtime liveness. Standalone Aquarium now survives a missing status bridge by returning a sleeping snapshot, and the frontend renders dormant Epiphanies as cold project bodies instead of pretending the EpiphanyAgent specialist system is alive.
  - Promoted the WebGPU froxel renderer to the visible stage. It now reconstructs camera rays, renders the grid as a procedural marched heightfield with PowerPulse wells, layers a surface-hugging fog bank over it, and keeps the Three grid hidden as rigging/fallback machinery.
  - Moved Bevy SH volumetric lighting out of projection space and into Grid space. The GPU compute pass now updates a 32x32x12 Grid-space coefficient volume, reprojection only remaps XY through previous Grid center/scale, and terrain, planets, and atmosphere sample lighting by world point.
  - Added a simulation-carried Self solar flare. The Grid-space SH compute pass now emits a short local impulse and pushes previous radiance outward along radial flow, letting the existing advection/scatter path form the visible volumetric wavefront.
  - Added a GPU-updated Bevy light brick map. A new compute pass rebuilds an 8x8x4 Grid-space occupancy buffer every frame, and the SH lighting pass uses those flags to skip empty bricks cheaply while adding extra flow/scatter detail in terrain/body/Self/flare bricks.
  - Added a Bevy `GridFrame` invariant. Camera target, Grid center, zoom-scaled Grid extent, pointer-to-grid projection, cursor gravity source clipping, and heightfield mesh generation now share the same moving XY square instead of leaving the Bevy grid nailed to world zero; world-space agent orbit anchors stay independent.
  - Reworked the Bevy raymarcher into a solid-only pass: fog and volumetric density are removed, the Grid is raymarched as solid terrain, and agent SDF bodies are tested only when their packed froxel membership mask intersects the current ray.
  - Removed traditional Bevy mesh rendering from the native aquarium world. The generated heightfield mesh, PBR body spheres, cursor probe meshes, and mesh rebuild path are gone; ECS bodies now feed simulation, labels, audio, cache snapshots, and raymarch uniforms only.
  - Integrated raymarched solids with Bevy's deferred prepass. The aquarium camera enables Depth/Normal/MotionVector/Deferred prepasses, and a custom graph node writes raymarched terrain/body G-buffer data into Bevy's prepass textures before deferred lighting/copy-id.
  - Removed the duplicate post-tonemap raymarch resolve. The old `AquariumRaymarchNode` is no longer in the render graph; SH/brick compute now runs inside the deferred prepass node immediately before the one active surface raymarch.
  - Added the first Bevy SH froxel lighting cache and Bruneton-inspired Grid atmosphere. The old procedural environment/wrap light was removed; Self injects warm radiance into propagated first-order SH coefficients, and the raymarcher integrates exponential atmosphere clinging to the Grid heightfield inside the current radial Grid mask.
  - Reduced Bevy atmosphere sampling artifacts by trilinear-filtering SH froxel reads, increasing the compact light grid to 12x7x8, widening the radial domain fade, and jittering terrain/atmosphere ray steps.
  - Moved Bevy SH froxel lighting from CPU/uniform updates to GPU compute. The old fullscreen-material helper was replaced by an Aquarium-specific render node with storage buffers, compute dispatch, and fullscreen raymarch composition in one graph slot.
