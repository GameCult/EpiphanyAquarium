project:
  name: Epiphany Aquarium
  root: E:\Projects\EpiphanyAquarium
  backend_root: E:\Projects\EpiphanyAgent
  purpose: >
    A cute, dynamic, fullscreen aquarium interface for Epiphany's operator and
    specialist state. The aquarium owns interaction grammar, visual simulation,
    audio feedback, motion language, and taste.

current_model:
  frontend:
    framework: React + Vite + Tauri v2
    primary_files:
      - src/App.tsx
      - src/aquariumFluid.ts
      - src/aquariumStardust.ts
      - src/styles.css
      - scripts/visual-smoke.mjs
  backend_boundary:
    description: >
      Tauri commands call scripts in the sibling EpiphanyAgent repo. The
      aquarium is a client and operator surface, not a harness source of truth.
      A swarm registry can now point multiple workspace-scoped Epiphany
      instances at the shared harness while keeping cwd, codex-home, state, and
      artifacts separate.
    env:
      - EPIPHANY_AGENT_ROOT
  artifacts:
    aquarium: .epiphany-aquarium
    backend_gui: E:\Projects\EpiphanyAgent\.epiphany-gui
  behavior_map: notes/aquarium-behavior-map.md
  backend_api_tree_map: notes/epiphany-agent-api-tree-map.md

interaction_laws:
  - The default screen shows only the aquarium, agents, fluid, and ambient state.
  - Data and controls appear only through interaction with aquarium objects.
  - Agent options are DOM controls anchored to the agent.
  - Focus surfaces are selected-agent local shells, not global panels.
  - Agent motion is force-based and role-symmetric: every creature has the same spring body, with orbit slots, cursor gravity-gradient attraction, hover hold, and future inter-Epiphany approach expressed as forces instead of coordinator exceptions.
  - Agent motion stays spring-tethered to visible orbit slots; cursor force is welcoming at range, only Soul pulls back weakly, and all creatures attract strongly up close.
  - Pointer force follows Aetheria's gravity model: derive force from a PowerPulse heightfield normal and scale by horizontal slope squared so wells taper near their centers.
  - Agents hover above their gravity cups; WebGL renders the well surface underneath, while DOM glyphs receive elevation and scale from projected height.
  - The Three.js spatial layer owns the visible 3D grid: gravity cups and chirp waves splat into a grid-aligned render target, then the mesh samples that accumulated gravity texture for displacement.
  - Aetheria's current PowerPulse envelope is the cup/mask curve; low chirp-bank partials become multiple radial wave emitters so excited agents vibrate the grid like small speakers.
  - The aquarium camera is near-omniscient: grid coordinates project through a tilted overhead camera, and cursor input unprojects back to the grid before applying force.
  - Three.js camera controls use an orbital rig: the target is a point on the XY grid, yaw/pitch/distance convert to a Cartesian camera offset, +Z is up, middle drag mutates yaw/pitch, wheel zooms exponentially, right drag pans by projected XY mouse-hit deltas, and WASD pans along the projected view basis.
  - Grid scale follows zoom: camera distance drives the procedural cell size so zooming reveals structures at different scales instead of only magnifying a fixed mesh.
  - Epiphany project labels are world-space DOM billboards projected by the Three camera and fade in as the user zooms out.
  - Three camera projection is the placement authority for DOM agents, thought bubbles, option halos, focus surfaces, stardust attractors, and pointer-to-grid input; percent-space projection is fallback only.
  - UI branches now use SVG/DOM camera-facing billboards attached to world-space creature anchors: Three emits separate focus/thought/option screen anchors and scales, and DOM pointer movement maps into billboard-local coordinates for crisp interaction.
  - The 3D body is the agent body. The centered DOM caption is its ID tag, hit target, and interaction-graph root; glyph icons are hidden because they duplicate the body.
  - When the pointer is inside a creature billboard, the creature's orbit integration holds position so menus do not drift away from the user's hand.
  - Visible non-DOM aquarium elements belong in the Three/HDR compositor. Legacy smoke, crisp, and stardust canvases may remain for compatibility, but they must not be visible screen-space layers.
  - Visual smoke verifies render presence and layout health, not cursor-driven 3D interaction; billboard/creature clicks need targeted raycast-aware probes.
  - Stardust is currently visible as tiny, faint 3D points inside the Three scene under ACES tone mapping; the old WebGPU overlay is disabled until it can feed the shared compositor instead of screen space.
  - Every creature carries the shared heartbeat; the latest awakened role gets the stronger plucked-string oscillation.
  - WebGL fluid emission must correspond to visible objects.
  - Audio must respond once per deliberate input gesture.

next_actions:
  - Expand visual smoke across all eight creature interaction trees, including the shared heartbeat branch.
  - Add visual tests for all eight creature habitats, not only Eyes.
  - Give Self, Face, Eyes, Imagination, Body, Hands, Soul, and Life distinct motion/reveal signatures.
  - Make agent petals more object-native while keeping them real DOM buttons.
  - Add visual tests for empty-water dismissal, offscreen-safe focus anchoring, agent-specific petals, and one-hit control audio.
  - Consider a debug-only keyboard chord for utilitarian always-on panels.
  - Deepen Face as the chat/aura organism now that backend heartbeatStatus, runHeartbeat, and faceBubble actions exist.
  - Render swarm members as first-class aquarium organisms instead of only selecting them through Self's connection leaf.

landed:
  - Face is now an interactible aquarium organism. Its habitat exposes heartbeat status, heartbeat pulse, and bubble leaves over EpiphanyAgent's backend GUI action bridge.
  - The Tauri action bridge passes heartbeatStatus, runHeartbeat, and faceBubble through to EpiphanyAgent, so Face can surface local Aquarium chat bubbles without Discord.
  - Heartbeat is now shared creature anatomy. Every agent habitat has a Heartbeat branch with Status and Pulse leaves; Face keeps the Bubble leaf as the public mouth.
  - Orbits are now visible as thin dashed gradient guides; mouse attraction pulls agents without severing orbit tethering, and touch/heartbeat chirps use plucked-string damping.
  - Aetheria-style gravity cups now shape pointer attraction and the WebGL aquarium surface; agents project a hover offset above their wells.
  - Added an optional WebGPU compute stardust layer modeled after Aetheria's compute particles, keyed from agent flow instead of gravity.
  - Added a tilted grid camera projection: shader pixels sample the grid through an inverse camera map, DOM agents project through the same view, and the cursor becomes a grid landing mark.
  - Added a Three.js field layer with an Aetheria-style orthographic gravity render target: additive PowerPulse and radial-wave splat quads feed a sampled grid mesh instead of forcing every grid vertex to evaluate every source.
  - Mapped the low-frequency agent chirp bank into radial grid vibration channels, preserving the Aetheria split between static wells and gas-giant-like wave breathing.
  - Added a swarm registry seam. `.epiphany-aquarium/swarm.json` registers EpiphanyAgent and AetheriaLore, and the Tauri backend scopes status, actions, codex-home, workspace root, and artifact roots to the selected member.
